name: QuantCore Pure SOTA CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Enforce least-privilege permissions across the entire workflow
permissions: {}

# Cancel obsolete in-flight runs when new commits arrive
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-sota-engine:
    name: Code Quality & SOTA Pipeline Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Python 3.12 Runtime
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "QuantCore-GrandMaster-Server/requirements.txt"

      - name: Install Production & Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r QuantCore-GrandMaster-Server/requirements.txt

      - name: Syntax & Bytecode Compilation Audit
        run: |
          python -m compileall -q QuantCore-GrandMaster-Server

      - name: Zero-Legacy Architecture Audit (No V23 Remnants)
        run: |
          python -c "
          import os, sys
          root = 'QuantCore-GrandMaster-Server'
          violators = []
          for dirpath, _, filenames in os.walk(root):
              for f in filenames:
                  if f.endswith('.py') and not f.startswith('.'):
                      p = os.path.join(dirpath, f)
                      with open(p, 'r', encoding='utf-8', errors='ignore') as fp:
                          text = fp.read()
                      if 'v23' in text.lower():
                          violators.append(p)
          if violators:
              print('❌ Found legacy V23 remnants in:', violators)
              sys.exit(1)
          print('✅ Zero-Legacy Audit: 100% pure modern architecture verified.')
          "

      - name: Run SOTA Feature Pipeline & Unit Tests
        run: |
          python -m unittest discover -s QuantCore-GrandMaster-Server/tests -p "test_*.py" -v

